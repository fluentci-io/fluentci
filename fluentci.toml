# Run the standard CI checks with `fluentci run` from any repository directory.
# Keep these private CI modules compatible with the pinned bootstrap CLI.
[[steps]]
name = "check"
command = "fluentci run main check"

[[modules]]
name = "main"
path = ".fluentci/main"
sdk = "purescript"

[[modules]]
name = "rust"
path = ".fluentci/rust"
sdk = "purescript"

[[modules]]
name = "studio"
path = ".fluentci/studio"
sdk = "purescript"

[[modules]]
name = "release"
path = ".fluentci/release"
sdk = "purescript"

[[modules]]
name = "nix"
path = ".fluentci/nix"
sdk = "purescript"

[[modules]]
name = "desktop"
path = ".fluentci/desktop"
sdk = "purescript"

[[modules]]
name = "nix-build"
path = ".fluentci/nix-build"
sdk = "purescript"

[[modules]]
name = "cachix"
path = ".fluentci/cachix"
sdk = "purescript"
