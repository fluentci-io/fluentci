# Run the standard CI checks with `fluentci run` from any repository directory.
[[steps]]
name = "check"
command = "fluentci run main check"

[[modules]]
name = "main"
version = "0.17.0"
description = "Standard FluentCI CI checks"
license = "MPL-2.0"
path = ".fluentci/main"
sdk = "purescript"

[[modules]]
name = "rust"
version = "0.17.0"
description = "FluentCI Rust build and validation jobs"
license = "MPL-2.0"
path = ".fluentci/rust"
sdk = "purescript"

[[modules]]
name = "studio"
version = "0.17.0"
description = "FluentCI Studio web build jobs"
license = "MPL-2.0"
path = ".fluentci/studio"
sdk = "purescript"

[[modules]]
name = "release"
version = "0.17.0"
description = "FluentCI CLI release packaging"
license = "MPL-2.0"
path = ".fluentci/release"
sdk = "purescript"

[[modules]]
