# Requires an operator-provided Ubuntu image and a sufficient workflow timeout.
when:
  - event: push
    branch: main
    paths:
      [
        "npm/**",
        ".tangled/**",
        ".github/workflows/npm.yml",
        ".github/scripts/export-setup-env.py",
      ]
  - event: pull_request
    paths:
      [
        "npm/**",
        ".tangled/**",
        ".github/workflows/npm.yml",
        ".github/scripts/export-setup-env.py",
      ]
  - event: manual

engine: microvm
image: ubuntu

environment:
  FLUENTCI_VERSION: "v0.17.3"
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "false"

steps:
  - name: Bootstrap Ubuntu and Node
    command: |
      set -euo pipefail
      bash .tangled/scripts/bootstrap.sh npm
  - name: Test npm installer and executable wrapper
    command: |
      set -euo pipefail
      source .tangled/scripts/common.sh
      cd npm
      npm test
      npm pack --dry-run --ignore-scripts
