# Requires the spindle AlmaLinux 10 image and a sufficient workflow timeout.
when:
  - event: push
    branch: main
  - event: pull_request
    branch: main
  - event: manual

engine: microvm
image: almalinux10

environment:
  FLUENTCI_VERSION: "v0.17.3"
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "false"

cache:
  - key: bun-almalinux10-v1
    hash: [bun.lock]
    fallback: true
    paths: [.ci-cache/bun]

steps:
  - name: Bootstrap AlmaLinux and API toolchains
    command: |
      set -euo pipefail
      bash .tangled/scripts/bootstrap-dnf.sh api
  - name: Install workspace dependencies
    command: |
      set -euo pipefail
      source .tangled/scripts/common.sh
      bun install --frozen-lockfile --ignore-scripts
  - name: Check generated lexicons and formatting
    command: |
      set -euo pipefail
      source .tangled/scripts/common.sh
      cd apps/api
      bun run lint
  - name: Build and test registry API
    command: |
      set -euo pipefail
      source .tangled/scripts/common.sh
      cd apps/api
      bun run build
      bun run test
