[package]
name = "fluentci-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Streaming multi-protocol build cache with pluggable object storage"
license = "MPL-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = "9.3.1"
object_store = { version = "0.12", features = ["aws", "http"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
sea-query = { version = "0.32", default-features = false, features = ["backend-sqlite"] }
sea-query-binder = { version = "0.7", features = ["sqlx-sqlite"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
