name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FluentCI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLUENTCI_VERSION: 'v0.17.2'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      # Keep release optimization while avoiding LTO for every test executable.
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test setup environment handoff
        run: python3 .github/scripts/test-setup-env.py && python3 .github/scripts/test-registry-artifact.py
      - name: Set up rust through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-rust@v0.2.1)
          fluentci --check-update=false run --wasm "$module_artifact" setup --toolchain stable --components '["rustfmt", "clippy"]' --targets '["wasm32-unknown-unknown", "wasm32-wasip2"]' | python3 .github/scripts/export-setup-env.py
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-bun@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Set up node through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-node@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-release-tests-no-lto
      - name: Set up purescript through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-purescript@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Verify the Wasm compiler toolchain by building modules
        run: fluentci --check-update=false modules --json
      - name: Verify compiled CI component interfaces
        run: node --test .fluentci/tests/components.test.mjs
      - name: Test shared SDK metadata inspection
        working-directory: templates/inspection
        run: |
          npm ci --ignore-scripts
          npm test
          python3 test_python.py
          python3 test_python_component.py
          cargo test --release --locked --manifest-path rust/Cargo.toml
          cargo clippy --release --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Test PureScript Linux packaging and publishing
        working-directory: .fluentci/gemfury
        run: npm test
      - name: Run tests with FluentCI
        run: |
          FLUENTCI_BIN="$(command -v fluentci)" fluentci --check-update=false run main check
      - name: Validate CI component metadata against native WIT inspection
        run: cargo test --release --locked --test config compiled_ci_components_have_typed_documented_signatures -- --ignored --exact
      - name: Test native component starter and generated WIT
        run: cargo test --release --locked --test components rust_component_starter_generates_wit_and_runs_without_extism -- --ignored --exact

  docs:
    name: Documentation workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-bun@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Set up node through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-node@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint, typecheck, and build documentation
        run: bunx turbo run lint typecheck build --filter=@fluentci/docs
      - name: Check internal links and public-source boundaries
        run: bun run test
        working-directory: docs
      - name: Install browser
        run: bunx playwright install --with-deps chromium
        working-directory: docs
      - name: Check navigation, search, themes, and responsive layouts
        run: bun run test:browser
        working-directory: docs
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-browser-results
          path: docs/test-results/
          if-no-files-found: ignore

  landing:
    name: Landing workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-bun@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint, typecheck, and build the landing page
        run: bunx turbo run lint typecheck build --filter=@fluentci/landing
      - name: Build landing component stories
        run: bun run build:storybook
        working-directory: apps/landing
      - name: Install the browser for responsive checks
        run: bunx playwright install --with-deps chromium
        working-directory: apps/landing
      - name: Check SDK tabs and responsive layouts
        run: bun run test:browser
        working-directory: apps/landing
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser-results
          path: apps/landing/test-results/
          if-no-files-found: ignore

  modules:
    name: Module download proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-bun@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Set up node through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-node@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint, typecheck, test, and bundle the Worker
        run: bunx turbo run lint typecheck test build --filter=@fluentci/modules

  api:
    name: Registry API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-bun@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Set up node through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-node@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - name: Set up gleam through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-gleam@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 1.19.2 | python3 .github/scripts/export-setup-env.py
      - name: Set up pkl through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-pkl@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 0.31.1 | python3 .github/scripts/export-setup-env.py
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check generated lexicons and formatting
        run: bun run lint
        working-directory: apps/api
      - name: Build and test the registry API
        run: bun run build && bun run test
        working-directory: apps/api
