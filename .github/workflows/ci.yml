name: Rust and Studio
on:
  push:
    branches: [main, rust-port]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - name: Discover PureScript CI modules
        run: fluentci --check-update=false modules --json
      - name: Run Rust and Studio checks
        run: fluentci --check-update=false run main check
