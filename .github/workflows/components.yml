name: Component SDKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUENTCI_VERSION: 'v0.17.3'

jobs:
  component:
    name: ${{ matrix.sdk }} component
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sdk:
          [
            typescript,
            purescript,
            gleam,
            rescript,
            clojurescript,
            python,
            elixir,
          ]
    env:
      FLUENTCI_COMPONENT_SDK: ${{ matrix.sdk }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up node through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-node@v0.2.0 setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-bun@v0.2.0 setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Set up rust through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-rust@v0.2.1 setup --toolchain stable --components '["rustfmt"]' --targets '["wasm32-wasip2"]' | python3 .github/scripts/export-setup-env.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: components-release-no-lto
      - name: Set up gleam through FluentCI
        if: matrix.sdk == 'gleam'
        shell: bash
        run: |
          fluentci --check-update=false run setup-gleam@v0.2.0 setup --version 1.19.2 | python3 .github/scripts/export-setup-env.py
      - name: Set up Erlang/OTP through FluentCI
        if: matrix.sdk == 'elixir'
        shell: bash
        run: |
          fluentci --check-update=false run setup-erlang@v0.2.0 setup --version 28 | python3 .github/scripts/export-setup-env.py
      - name: Set up elixir through FluentCI
        if: matrix.sdk == 'elixir'
        shell: bash
        run: |
          fluentci --check-update=false run setup-elixir@v0.2.0 setup --version 1.20.4 --otp-version 28 | python3 .github/scripts/export-setup-env.py
      - name: Set up uv through FluentCI
        if: matrix.sdk == 'python'
        shell: bash
        run: |
          fluentci --check-update=false run setup-uv@v0.2.0 setup | python3 .github/scripts/export-setup-env.py
      - name: Set up java through FluentCI
        if: matrix.sdk == 'clojurescript'
        shell: bash
        run: |
          fluentci --check-update=false run setup-java@v0.2.0 setup --version 21 | python3 .github/scripts/export-setup-env.py
      - name: Set up clojure through FluentCI
        if: matrix.sdk == 'clojurescript'
        shell: bash
        run: |
          fluentci --check-update=false run setup-clojure@v0.2.0 setup --version 1.12.5.1654 | python3 .github/scripts/export-setup-env.py
      - name: Set up purescript through FluentCI
        if: matrix.sdk == 'purescript'
        shell: bash
        run: |
          fluentci --check-update=false run setup-purescript@v0.2.0 setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Check WIT host contract and generated SDKs
        run: |
          cargo run --release --locked --manifest-path tools/component-model/Cargo.toml -- . engine/schema/executor-model.json --check
          python3 scripts/generate-component-host.py --check
      - name: Build Studio assets
        working-directory: webui
        run: bun install --frozen-lockfile --ignore-scripts && bun run build:web
      - name: Compile generated WIT, inspect metadata, and invoke native component
        run: cargo test --release --locked --test components language_component_starter_generates_wit_and_runs_without_extism -- --ignored --exact --nocapture
