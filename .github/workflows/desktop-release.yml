name: Studio desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to upload to; always builds the selected branch (empty = artifacts only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag || format('manual-{0}', github.run_number) }}
  FLUENTCI_VERSION: 'v0.17.3'
  DESKTOP_MODULE: .fluentci/desktop/dist/plugin.wasm

jobs:
  prepare:
    name: Compile the desktop release module
    runs-on: ubuntu-24.04
    steps:
      # Pin both jobs to this event's source commit. A manual tag only selects
      # the upload destination, so older releases cannot replace the build tools.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up node through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-node@v0.2.0 setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - name: Set up purescript through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-purescript@v0.2.0 setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Compile the desktop module with FluentCI
        run: fluentci --check-update=false modules desktop --json
      - name: Verify desktop packaging and cleanup safeguards
        run: node --test .fluentci/desktop/test/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-module
          path: .fluentci/desktop/dist/plugin.wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Release Studio desktop (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up rust through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-rust@0.2.2 setup --toolchain stable --targets "${{ matrix.target }}" | python3 .github/scripts/export-setup-env.py
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-bun@v0.2.0 setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Set up node through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-node@v0.2.0 setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-module
          path: .fluentci/desktop/dist
      - name: Verify the downloaded desktop module
        run: test -s "$DESKTOP_MODULE"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop-release-${{ matrix.target }}
      - name: Build the desktop app with FluentCI
        run: fluentci --check-update=false run --wasm "$DESKTOP_MODULE" build --target "$TARGET"
      - name: Clean intermediate desktop builds with FluentCI
        run: fluentci --check-update=false run --wasm "$DESKTOP_MODULE" clean --target "$TARGET"
      - name: Ad hoc sign, verify, and package the desktop app
        run: fluentci --check-update=false run --wasm "$DESKTOP_MODULE" package --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Preserve desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: fluentci-studio-${{ matrix.target }}
          path: desktop/release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop GitHub release assets with FluentCI
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$DESKTOP_MODULE" upload --target "$TARGET" --version "$RELEASE_VERSION"
