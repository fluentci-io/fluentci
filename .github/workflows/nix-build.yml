name: Nix build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compile Nix and Cachix Wasm modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install PureScript Wasm compiler toolchain
        run: sh .fluentci/scripts/install-sdk-tools.sh
      - name: Compile and test Nix module
        working-directory: .fluentci/nix-build
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Compile and test Cachix module
        working-directory: .fluentci/cachix
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: nix-ci-wasm
          path: |
            .fluentci/nix-build/dist/plugin.wasm
            .fluentci/cachix/dist/plugin.wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build FluentCI (${{ matrix.system }})
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Set up FluentCI
        uses: fluentci-io/setup-fluentci@next
      - uses: actions/download-artifact@v4
        with:
          name: nix-ci-wasm
          path: .fluentci
      - name: Set up optional Cachix cache through FluentCI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: fluentci
        run: fluentci --check-update=false run --wasm .fluentci/cachix/dist/plugin.wasm setup --cache "$CACHIX_CACHE"
      - name: Build Nix package and upload cache through FluentCI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: fluentci --check-update=false run --wasm .fluentci/nix-build/dist/plugin.wasm build --cache fluentci
