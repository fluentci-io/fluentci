name: Nix build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUENTCI_VERSION: 'v0.17.3'

jobs:
  prepare:
    name: Compile Nix and Cachix Wasm modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - name: Set up node through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-node@v0.2.0 setup --version 24.22.2 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Set up purescript through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-purescript@v0.2.0 setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Compile and test Nix module
        working-directory: .fluentci/nix-build
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Compile and test Cachix module
        working-directory: .fluentci/cachix
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Stage CI modules with explicit relative paths
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nix-ci-wasm/nix-build/dist" "$RUNNER_TEMP/nix-ci-wasm/cachix/dist"
          cp .fluentci/nix-build/dist/plugin.wasm "$RUNNER_TEMP/nix-ci-wasm/nix-build/dist/plugin.wasm"
          cp .fluentci/cachix/dist/plugin.wasm "$RUNNER_TEMP/nix-ci-wasm/cachix/dist/plugin.wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: nix-ci-wasm
          path: ${{ runner.temp }}/nix-ci-wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build FluentCI (${{ matrix.system }})
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - name: Set up determinate-nix through FluentCI
        shell: bash
        run: |
          trusted_users=$(id -un)
          fluentci --check-update=false run setup-determinate-nix@v0.2.1 setup --sudo --trusted-users "$trusted_users" | escript .github/scripts/fluentci_ci export-setup-env
      - uses: actions/download-artifact@v4
        with:
          name: nix-ci-wasm
          path: .fluentci
      - name: Check downloaded CI module paths
        shell: bash
        run: |
          test -s .fluentci/nix-build/dist/plugin.wasm
          test -s .fluentci/cachix/dist/plugin.wasm
      - name: Set up Cachix through FluentCI
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          NIX_CONFIG: |
            access-tokens = github.com=${{ github.token }}
        # Cachix publishes source tags, not GitHub Releases; pin the upstream
        # version to bypass this plugin's releases/latest lookup.
        run: fluentci --check-update=false run setup-cachix@0.2.1 setup --version 1.14.0 --cache fluentci | escript .github/scripts/fluentci_ci export-setup-env
      - name: Build Nix package and upload cache through FluentCI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          NIX_CONFIG: |
            access-tokens = github.com=${{ github.token }}
        run: fluentci --check-update=false run --wasm .fluentci/nix-build/dist/plugin.wasm build --cache fluentci
