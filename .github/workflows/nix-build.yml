name: Nix build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUENTCI_VERSION: "v0.17.8"

jobs:
  prepare:
    name: Compile Nix Wasm module
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - name: Set up node through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-node@v0.2.0 setup --version 24.22.2 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Set up purescript through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-purescript@v0.2.0 setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Compile and test Nix module
        working-directory: .fluentci/nix-build
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Stage CI modules with explicit relative paths
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nix-ci-wasm/nix-build/dist"
          cp .fluentci/nix-build/dist/plugin.wasm "$RUNNER_TEMP/nix-ci-wasm/nix-build/dist/plugin.wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: nix-ci-wasm
          path: ${{ runner.temp }}/nix-ci-wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build FluentCI (${{ matrix.system }})
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - name: Set up determinate-nix through FluentCI
        shell: bash
        run: |
          trusted_users=$(id -un)
          fluentci --check-update=false run setup-determinate-nix@0.2.2 setup --sudo --trusted-users "$trusted_users" | escript .github/scripts/fluentci_ci export-setup-env
      - uses: actions/download-artifact@v4
        with:
          name: nix-ci-wasm
          path: .fluentci
      - name: Check downloaded CI module paths
        shell: bash
        run: |
          test -s .fluentci/nix-build/dist/plugin.wasm
      - name: Check Nix cache exports with native references
        run: FLUENTCI_TEST_NIX=1 node --test .fluentci/nix-build/test/native.test.mjs
      - name: Build Nix package and upload cache through FluentCI
        env:
          FLUENTCI_CACHE_URL: ${{ vars.FLUENTCI_CACHE_URL }}
          FLUENTCI_NIX_PUBLIC_KEY: ${{ vars.FLUENTCI_NIX_PUBLIC_KEY }}
          FLUENTCI_CACHE_TOKEN: ${{ secrets.FLUENTCI_CACHE_TOKEN }}
          FLUENTCI_NIX_SIGNING_KEY: ${{ secrets.FLUENTCI_NIX_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          NIX_CONFIG: |
            access-tokens = github.com=${{ github.token }}
        run: fluentci --check-update=false run --wasm .fluentci/nix-build/dist/plugin.wasm build
