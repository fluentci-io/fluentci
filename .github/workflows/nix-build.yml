name: Nix build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compile Nix and Cachix Wasm modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up node through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-node@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
      - name: Set up purescript through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-purescript@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | python3 .github/scripts/export-setup-env.py
      - name: Compile and test Nix module
        working-directory: .fluentci/nix-build
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Compile and test Cachix module
        working-directory: .fluentci/cachix
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: nix-ci-wasm
          path: |
            .fluentci/nix-build/dist/plugin.wasm
            .fluentci/cachix/dist/plugin.wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build FluentCI (${{ matrix.system }})
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up determinate-nix through FluentCI
        shell: bash
        run: |
          module_artifact=$(python3 .github/scripts/registry-artifact.py setup-determinate-nix@v0.2.0)
          fluentci --check-update=false run --wasm "$module_artifact" setup --sudo | python3 .github/scripts/export-setup-env.py
      - uses: actions/download-artifact@v4
        with:
          name: nix-ci-wasm
          path: .fluentci
      - name: Set up optional Cachix cache through FluentCI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: fluentci
        run: fluentci --check-update=false run --wasm .fluentci/cachix/dist/plugin.wasm setup --cache "$CACHIX_CACHE"
      - name: Build Nix package and upload cache through FluentCI
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: fluentci --check-update=false run --wasm .fluentci/nix-build/dist/plugin.wasm build --cache fluentci
