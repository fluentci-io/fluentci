name: Publish Nix flake through FluentCI

on:
  workflow_call:
    inputs:
      registry:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag and compile publishing Wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve existing release tag
        id: release
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
          REGISTRY: ${{ inputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REGISTRY" in
            flakehub|flakestry) ;;
            *) echo "Unsupported registry: $REGISTRY" >&2; exit 1 ;;
          esac
          if [[ ! "$PUBLISH_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release version tag, for example v0.17.0" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$PUBLISH_TAG"
          revision=$(git rev-parse --verify "refs/tags/$PUBLISH_TAG^{commit}")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install PureScript Wasm compiler toolchain
        run: sh .fluentci/scripts/install-sdk-tools.sh
      - name: Compile and test publishing module
        working-directory: .fluentci/nix
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: nix-publish-${{ inputs.registry }}-wasm
          path: .fluentci/nix/dist/plugin.wasm
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to ${{ inputs.registry }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: fluentci-io/setup-fluentci@next
      - uses: actions/download-artifact@v4
        with:
          name: nix-publish-${{ inputs.registry }}-wasm
          path: ${{ runner.temp }}/nix-publish
      - name: Install FlakeHub publishing tool
        if: inputs.registry == 'flakehub'
        run: nix profile install github:DeterminateSystems/flakehub-push
      - name: Install Flakestry publishing tools
        if: inputs.registry == 'flakestry'
        run: nix profile install nixpkgs#jo nixpkgs#jq
      - name: Publish tagged flake through PureScript Wasm
        env:
          REGISTRY: ${{ inputs.registry }}
          RELEASE_VERSION: ${{ inputs.tag }}
          VERSION: ${{ inputs.tag }}
          REF: ${{ needs.prepare.outputs.revision }}
          FLAKEHUB_PUSH_REV: ${{ needs.prepare.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RUNNER_TEMP/nix-publish/plugin.wasm" "$REGISTRY"
