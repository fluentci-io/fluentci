name: Publish Nix flake through FluentCI

on:
  workflow_call:
    inputs:
      registry:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read

env:
  FLUENTCI_VERSION: 'v0.17.3'

jobs:
  prepare:
    name: Resolve release revision
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve existing release tag
        id: release
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
          REGISTRY: ${{ inputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REGISTRY" in
            flakehub|flakestry) ;;
            *) echo "Unsupported registry: $REGISTRY" >&2; exit 1 ;;
          esac
          if [[ ! "$PUBLISH_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release version tag, for example v0.17.0" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$PUBLISH_TAG"
          revision=$(git rev-parse --verify "refs/tags/$PUBLISH_TAG^{commit}")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Preserve setup environment bridge for older release checkouts
        uses: actions/upload-artifact@v4
        with:
          name: nix-setup-environment-${{ inputs.registry }}
          path: |
            .github/scripts/export-setup-env.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to ${{ inputs.registry }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - name: Download setup environment bridge
        uses: actions/download-artifact@v4
        with:
          name: nix-setup-environment-${{ inputs.registry }}
          path: ${{ runner.temp }}/nix-setup
      - name: Bootstrap FluentCI
        shell: bash
        run: |
          curl -fsSL https://cli.fluentci.io | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up determinate-nix through FluentCI
        shell: bash
        run: |
          trusted_users=$(printf '["%s"]' "$(id -un)")
          fluentci --check-update=false run setup-determinate-nix@v0.2.1 setup --sudo --trusted-users "$trusted_users" | python3 "$RUNNER_TEMP/nix-setup/export-setup-env.py"
      - name: Set up FlakeHub publisher through FluentCI
        if: inputs.registry == 'flakehub'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This plugin fetches GitHub release metadata and GitHub-hosted assets
          # with curl. Authenticate its requests to avoid the shared runner's
          # unauthenticated API quota; keep credentials out of command arguments.
          umask 077
          curl_home=$(mktemp -d "$RUNNER_TEMP/flakehub-setup-curl.XXXXXXXX")
          trap 'rm -rf "$curl_home"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$curl_home/.curlrc"
          CURL_HOME="$curl_home" fluentci --check-update=false run setup-flakehub-push@v0.2.0 setup | python3 "$RUNNER_TEMP/nix-setup/export-setup-env.py"
      - name: Set up Bun for Flakestry through FluentCI
        if: inputs.registry == 'flakestry'
        shell: bash
        run: |
          fluentci --check-update=false run setup-bun@v0.2.0 setup --version 1.4.3 | python3 "$RUNNER_TEMP/nix-setup/export-setup-env.py"
      - name: Publish tagged flake through PureScript Wasm
        env:
          REGISTRY: ${{ inputs.registry }}
          RELEASE_VERSION: ${{ inputs.tag }}
          VERSION: ${{ inputs.tag }}
          REF: ${{ needs.prepare.outputs.revision }}
          FLAKEHUB_PUSH_REV: ${{ needs.prepare.outputs.revision }}
          FLAKEHUB_PUSH_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NIX_CONFIG: |
            access-tokens = github.com=${{ github.token }}
        run: |
          if [ "$REGISTRY" = flakestry ]; then
            fluentci --check-update=false run nix-publish@v0.2.0 flakestry --run-dir "$RUNNER_TEMP/flakestry-$GITHUB_RUN_ATTEMPT" --version "$VERSION" --ref "$REF" --timeout-ms 2400000
          else
            fluentci --check-update=false run nix-publish@v0.2.0 flakehub --run-dir "$RUNNER_TEMP/flakehub-$GITHUB_RUN_ATTEMPT" --name "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --timeout-ms 2400000
          fi
