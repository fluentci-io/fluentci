name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and upload
        required: true
        type: string
      source-ref:
        description: Optional source commit or branch to rebuild (defaults to the release tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
  BSD_RUST_VERSION: '1.99.1'
  FLUENTCI_VERSION: 'v0.17.0'
  RELEASE_MODULE: .fluentci/release/dist/plugin.wasm

jobs:
  studio:
    name: Build Studio and portable release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - name: Set up FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the PureScript Wasm compiler toolchain
        run: sh .fluentci/scripts/install-sdk-tools.sh
      - name: Prepare release inputs with FluentCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run release prepare
      - name: Compile and test Gemfury PureScript Wasm module
        working-directory: .fluentci/gemfury
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: |
            webui/dist/
            .release-smoke/*.wasm
            .fluentci/release/dist/plugin.wasm
            .fluentci/gemfury/dist/plugin.wasm
            .fluentci/gemfury/dist/plugin.cjs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release ${{ matrix.target }}
    needs: studio
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - name: Set up FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: .
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies with FluentCI
        if: runner.os == 'Linux'
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" linuxDependencies
      - name: Build release binary with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" buildPrepared
      - name: Check release binary with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" check
      - name: Package release assets with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" package
      - name: Install Linux packaging tools through PureScript Wasm
        if: runner.os == 'Linux'
        run: fluentci --check-update=false run --wasm .fluentci/gemfury/dist/plugin.wasm dependencies
      - name: Verify native Debian and RPM package formats
        if: runner.os == 'Linux'
        run: node --test .fluentci/gemfury/test/package.test.mjs
      - name: Build Debian and RPM packages through PureScript Wasm
        if: runner.os == 'Linux'
        run: fluentci --check-update=false run --wasm .fluentci/gemfury/dist/plugin.wasm package
      - name: Upload GitHub release assets with FluentCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" upload
      - name: Upload Linux package assets to GitHub release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm .fluentci/gemfury/dist/plugin.wasm github
      - name: Upload Debian and RPM packages to Gemfury through PureScript Wasm
        if: runner.os == 'Linux'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_USER: ${{ secrets.FURY_USER || vars.FURY_USER }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT || vars.FURY_ACCOUNT }}
        run: fluentci --check-update=false run --wasm .fluentci/gemfury/dist/plugin.wasm upload

  bsd:
    name: Release ${{ matrix.target }}
    needs: studio
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '14.3'
            target: x86_64-unknown-freebsd
          - os: netbsd
            version: '10.1'
            target: x86_64-unknown-netbsd
          - os: openbsd
            version: '7.8'
            target: x86_64-unknown-openbsd
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - name: Set up FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: .
      - name: Reserve BSD runner disk space with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" reserveBsdDisk
      - name: Cache native BSD toolchains and Cargo artifacts
        uses: actions/cache@v4
        with:
          path: .ci-cache/bsd-rust
          key: bsd-release-v1-${{ matrix.os }}-${{ matrix.version }}-${{ env.BSD_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'engine/**/Cargo.toml', '.github/scripts/*bsd*') }}-${{ hashFiles('src/**/*.rs', 'engine/**/*.rs', 'webui/dist/**') }}
          restore-keys: |
            bsd-release-v1-${{ matrix.os }}-${{ matrix.version }}-${{ env.BSD_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'engine/**/Cargo.toml', '.github/scripts/*bsd*') }}-
            bsd-release-v1-${{ matrix.os }}-${{ matrix.version }}-${{ env.BSD_RUST_VERSION }}-
      - name: Build and smoke-test FreeBSD release
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: ${{ matrix.version }}
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          envs: 'RELEASE_VERSION TARGET BSD_RUST_VERSION FLUENTCI_VERSION RELEASE_MODULE'
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            sh .github/scripts/prepare-bsd-release.sh
            curl -fsSL https://raw.githubusercontent.com/fluentci-io/fluentci/main/install.sh | sh
          run: |
            set -eu
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsdBuild
      - name: Build and smoke-test NetBSD release
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          release: ${{ matrix.version }}
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          envs: 'RELEASE_VERSION TARGET BSD_RUST_VERSION FLUENTCI_VERSION RELEASE_MODULE'
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            sh .github/scripts/prepare-bsd-release.sh
            curl -fsSL https://raw.githubusercontent.com/fluentci-io/fluentci/main/install.sh | sh
          run: |
            set -eu
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsdBuild
      - name: Build and smoke-test OpenBSD release
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: ${{ matrix.version }}
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          envs: 'RELEASE_VERSION TARGET BSD_RUST_VERSION FLUENTCI_VERSION RELEASE_MODULE'
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            sh .github/scripts/prepare-bsd-release.sh
            # Bootstrap from the fork's latest release. This pinned installer
            # resolves tsirysndr/fluentci rather than the upstream repository.
            curl -fsSL https://raw.githubusercontent.com/tsirysndr/fluentci/7c25793ca7230852a499468775afa92b323043c7/install.sh | FLUENTCI_VERSION=latest sh
          run: |
            set -eu
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            # The released bootstrap cannot resolve current_exe on OpenBSD.
            # Enter its Wasm worker directly; the release module still drives the build.
            WASM_ENABLED=1 "$HOME/.local/bin/fluentci" __engine-call --module "$RELEASE_MODULE" -- bsdBuild
      - name: Verify copied-back BSD assets with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsdVerify
      - name: Preserve BSD failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-release-failure-${{ matrix.target }}
          path: |
            .release-smoke/*.log
            dist/bsd/${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload BSD GitHub release assets with FluentCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsdUpload
