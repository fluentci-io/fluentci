name: release
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile --ignore-scripts && bun run build:web
        working-directory: webui
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          cp "target/$TARGET/release/fluentci" fluentci
          tar czf "fluentci_${RELEASE_VERSION}_${TARGET}.tar.gz" fluentci
          shasum -a 256 "fluentci_${RELEASE_VERSION}_${TARGET}.tar.gz" > "fluentci_${RELEASE_VERSION}_${TARGET}.tar.gz.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_VERSION" fluentci_*.tar.gz fluentci_*.sha256
