name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and upload
        required: true
        type: string
      source-ref:
        description: Optional source commit or branch to rebuild (defaults to the release tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
  BSD_RUST_VERSION: '1.99.1'
  FLUENTCI_VERSION: 'v0.17.3'
  RELEASE_MODULE: .fluentci/release/dist/plugin.wasm

jobs:
  studio:
    name: Build Studio and portable release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - name: Set up rust through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-rust@0.2.2 setup --toolchain stable | escript .github/scripts/fluentci_ci export-setup-env
      - name: Set up bun through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-bun@v0.2.0 setup --version 1.4.3 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Set up node through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-node@v0.2.0 setup --version 24.22.2 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Set up purescript through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-purescript@v0.2.0 setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | escript .github/scripts/fluentci_ci export-setup-env
      - name: Prepare release inputs with FluentCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run release prepare --version "$RELEASE_VERSION"
      - name: Test release packaging logic
        working-directory: .fluentci/release
        run: node --test test/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: |
            webui/dist/
            .release-smoke/*.wasm
            .github/scripts/fluentci_ci
            .fluentci/release/dist/plugin.wasm
            .fluentci/release/dist/plugin.cjs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release ${{ matrix.target }}
    needs: studio
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - name: Set up rust through FluentCI
        shell: bash
        run: |
          fluentci --check-update=false run setup-rust@0.2.2 setup --toolchain stable --targets "${{ matrix.target }}" | escript .github/scripts/fluentci_ci export-setup-env
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: .
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies with FluentCI
        if: runner.os == 'Linux'
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" linux-dependencies
      - name: Build release binary with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" build-prepared --target "$TARGET"
      - name: Check release binary with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" check --target "$TARGET"
      - name: Package release assets with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" package --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Install Linux packaging tools through PureScript Wasm
        if: endsWith(matrix.target, '-linux-gnu')
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" linux-package-dependencies --target "$TARGET"
      - name: Verify native Debian and RPM package formats
        if: endsWith(matrix.target, '-linux-gnu')
        run: node --test .fluentci/release/test/package.test.mjs
      - name: Build Debian and RPM packages through PureScript Wasm
        if: endsWith(matrix.target, '-linux-gnu')
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" linux-package --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Upload GitHub release assets with FluentCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" upload --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Upload Linux package assets to GitHub release
        if: endsWith(matrix.target, '-linux-gnu')
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" linux-package-github --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Set up published Gemfury prerequisites
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          fluentci --check-update=false run --frozen-lockfile setup-gemfury setup | escript .github/scripts/fluentci_ci export-setup-env
      - name: Upload Debian and RPM packages with published Gemfury
        if: endsWith(matrix.target, '-linux-gnu')
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_USER: ${{ secrets.FURY_USER || vars.FURY_USER }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT || vars.FURY_ACCOUNT }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" linux-package-publish --target "$TARGET" --version "$RELEASE_VERSION"

  bsd:
    name: Release ${{ matrix.target }}
    needs: studio
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '14.3'
            target: x86_64-unknown-freebsd
          - os: netbsd
            version: '10.1'
            target: x86_64-unknown-netbsd
          - os: openbsd
            version: '7.8'
            target: x86_64-unknown-openbsd
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - name: Bootstrap FluentCI
        uses: fluentci-io/setup-fluentci@next
        with:
          version: ${{ env.FLUENTCI_VERSION }}
      - name: Restore BEAM tooling for historical checkouts
        shell: bash
        env:
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          if [ ! -f .github/scripts/gleam.toml ]; then
            git fetch origin "$WORKFLOW_REVISION" --depth 1
            git restore --source="$WORKFLOW_REVISION" -- .github/scripts/gleam.toml .github/scripts/manifest.toml .github/scripts/src .github/scripts/test .github/scripts/.gitignore .github/scripts/README.md .github/actions/setup-ci-scripts
          fi
      - name: Set up Gleam BEAM CI helpers
        uses: ./.github/actions/setup-ci-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          path: .
      - name: Reserve BSD runner disk space with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" reserve-bsd-disk
      - name: Download component-capable OpenBSD bootstrap
        if: matrix.os == 'openbsd'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=.release-bootstrap/openbsd
          mkdir -p "$bootstrap"
          # Use the same component-capable release on every platform.
          tag="$FLUENTCI_VERSION"
          archive="fluentci_${tag}_x86_64-unknown-openbsd.tar.gz"
          test -n "$tag" && test -n "$archive"
          case "$archive" in
            fluentci_*_x86_64-unknown-openbsd.tar.gz) ;;
            *) echo 'Unexpected OpenBSD release asset name' >&2; exit 1 ;;
          esac
          case "$archive" in */*) echo 'Invalid archive path' >&2; exit 1 ;; esac
          gh release download "$tag" --repo fluentci-io/fluentci \
            --pattern "$archive" --pattern "$archive.sha256" --dir "$bootstrap"
          expected=$(awk 'NR == 1 { print $1 }' "$bootstrap/$archive.sha256")
          actual=$(sha256sum "$bootstrap/$archive" | awk '{ print $1 }')
          test "$expected" = "$actual"
          tar -xzf "$bootstrap/$archive" -C "$bootstrap" fluentci
          (cd "$bootstrap" && sha256sum fluentci > fluentci.sha256)
          printf 'OpenBSD bootstrap: fluentci-io/fluentci release %s (%s)\n' "$tag" "$archive"
      - name: Cache native BSD toolchains and Cargo artifacts
        uses: actions/cache@v4
        with:
          path: .ci-cache/bsd-rust
          key: bsd-release-v1-${{ matrix.os }}-${{ matrix.version }}-${{ env.BSD_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'engine/**/Cargo.toml', '.github/scripts/src/**', '.github/scripts/manifest.toml') }}-${{ hashFiles('src/**/*.rs', 'engine/**/*.rs', 'webui/dist/**') }}
          restore-keys: |
            bsd-release-v1-${{ matrix.os }}-${{ matrix.version }}-${{ env.BSD_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'engine/**/Cargo.toml', '.github/scripts/src/**', '.github/scripts/manifest.toml') }}-
            bsd-release-v1-${{ matrix.os }}-${{ matrix.version }}-${{ env.BSD_RUST_VERSION }}-
      - name: Build and smoke-test FreeBSD release
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: ${{ matrix.version }}
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          envs: 'RELEASE_VERSION TARGET BSD_RUST_VERSION FLUENTCI_VERSION RELEASE_MODULE'
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            pkg install -y curl
            curl -fsSL https://raw.githubusercontent.com/fluentci-io/fluentci/main/install.sh | sh
          run: |
            set -eu
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            fluentci --check-update=false run @fluentci.io/setup-erlang@0.2.0 setup
            fluentci --check-update=false run @fluentci.io/setup-gleam@0.2.0 setup
            escript .github/scripts/fluentci_ci prepare-bsd-release
            fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsd-build --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Build and smoke-test NetBSD release
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          release: ${{ matrix.version }}
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          envs: 'RELEASE_VERSION TARGET BSD_RUST_VERSION FLUENTCI_VERSION RELEASE_MODULE'
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            if [ ! -x /usr/pkg/bin/pkgin ]; then /usr/sbin/pkg_add pkgin; fi
            repositories=$(sed -n 's/^PKG_PATH=//p' /etc/pkg_install.conf)
            test -n "$repositories"
            printf '%s\n' "$repositories" | tr ';' '\n' > /usr/pkg/etc/pkgin/repositories.conf
            /usr/pkg/bin/pkgin -y update
            /usr/pkg/bin/pkgin -y install curl
            curl -fsSL https://raw.githubusercontent.com/fluentci-io/fluentci/main/install.sh | sh
          run: |
            set -eu
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            fluentci --check-update=false run @fluentci.io/setup-erlang@0.2.0 setup
            fluentci --check-update=false run @fluentci.io/setup-gleam@0.2.0 setup
            escript .github/scripts/fluentci_ci prepare-bsd-release
            fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsd-build --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Build and smoke-test OpenBSD release
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: ${{ matrix.version }}
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          envs: 'RELEASE_VERSION TARGET BSD_RUST_VERSION FLUENTCI_VERSION RELEASE_MODULE'
          prepare: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            pkg_add -I curl
            # The runner downloaded and verified the component-capable OpenBSD asset.
            # Verify the synchronized binary again, then install without install.sh.
            bootstrap=.release-bootstrap/openbsd
            expected=$(awk 'NR == 1 { print $1 }' "$bootstrap/fluentci.sha256")
            test "$(sha256 -q "$bootstrap/fluentci")" = "$expected"
            mkdir -p "$HOME/.local/bin"
            install -m 755 "$bootstrap/fluentci" "$HOME/.local/bin/fluentci"
          run: |
            set -eu
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin"
            fluentci --check-update=false run @fluentci.io/setup-erlang@0.2.0 setup
            fluentci --check-update=false run @fluentci.io/setup-gleam@0.2.0 setup
            escript .github/scripts/fluentci_ci prepare-bsd-release
            fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsd-build --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Verify copied-back BSD assets with FluentCI
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsd-verify --target "$TARGET" --version "$RELEASE_VERSION"
      - name: Preserve BSD failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-release-failure-${{ matrix.target }}
          path: |
            .release-smoke/*.log
            dist/bsd/${{ matrix.target }}/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload BSD GitHub release assets with FluentCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" bsd-upload --target "$TARGET" --version "$RELEASE_VERSION"
