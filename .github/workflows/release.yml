name: release
on:
  release:
    types: [created]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - name: Build release target
        run: fluentci --check-update=false run release build
        env:
          TARGET: ${{ matrix.target }}
      - name: Package release
        run: fluentci --check-update=false run release package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
      - name: Upload release assets
        run: fluentci --check-update=false run release upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
