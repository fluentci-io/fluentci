name: Publish tags to Flakestry

on:
  push:
    tags: ["v?[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.17.0)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: flakestry-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'fluentci-io/fluentci'
    uses: ./.github/workflows/nix-publish.yml
    with:
      registry: flakestry
      tag: ${{ inputs.tag || github.ref_name }}
