# @generated by autocargo from //buck2/superconsole:superconsole

[package]
name = "fluentci-superconsole"
version = "0.3.1"
authors = ["Meta"]
edition = "2024"
description = "FluentCI BSD-compatible fork of Meta SuperConsole"
documentation = "https://docs.rs/superconsole"
repository = "https://github.com/facebookincubator/superconsole"
license = "MIT OR Apache-2.0"
keywords = ["TUI"]
categories = ["command-line-interface"]

[lib]
name = "superconsole"

[dependencies]
anstyle-parse = "1.0.0"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
crossterm = { version = "0.29", default-features = false, features = ["serde", "windows"] }
futures = "0.3.34"
itertools = "0.15.0"
pin-project = "1.1.13"
take_mut = "0.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "rt", "sync"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.41"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
anyhow = "1.0.104"
derive_more = { version = "2.1.1", features = ["full"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

# RawReader is compiled on every Unix target, including all three BSDs.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
