[package]
name = "fluentci-executor"
version = "0.1.2"
edition = "2021"
license = "MPL-2.0"
description = "Dependency-aware host process executor for FluentCI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
rmp-serde = "1.3"
url = "2"
fluentci-primitives = { path = "../primitives", version = "0.1.0" }
opentelemetry = "0.22"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
opentelemetry_sdk = "0.22"
