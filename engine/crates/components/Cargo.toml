[package]
name = "fluentci-components"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Native WIT component runtime for FluentCI"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-component = "=0.258.3"
wit-parser = "=0.258.3"
fluentci-core = { path = "../core", version = "0.3.11" }
fluentci-executor = { path = "../executor", version = "0.1.2" }

[target.'cfg(not(target_os = "openbsd"))'.dependencies]
wasmtime = { version = "=49.0.5", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "component-model"] }
wasmtime-wasi = { version = "=49.0.5", default-features = false, features = ["p2"] }

[target.'cfg(target_os = "openbsd")'.dependencies]
wasmtime = { version = "=41.0.4", default-features = false, features = [ "std", "runtime", "cranelift", "component-model"] }
wasmtime-wasi = { version = "=41.0.4", default-features = false, features = ["p2"] }

[dev-dependencies]
wat = "1"
tempfile = "3"
