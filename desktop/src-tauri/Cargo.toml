[package]
name = "fluentci-desktop"
version = "0.1.0"
description = "FluentCI Studio desktop app"
authors = ["Tsiry Sandratraina"]
license = "MPL-2.0"
edition = "2024"
rust-version = "1.96"

[lib]
name = "fluentci_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8"
clap = "4"
dirs = "6"
fluentci = { path = "../.." }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
wat = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true

[patch.crates-io]
wasmtime = { path = "../../engine/vendor/wasmtime" }
